<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Production CSP. Vite swaps it for a dev variant when serving (see vite.config.ts).
         fonts.googleapis.com / fonts.gstatic.com are temporary until Outfit is self-hosted. -->

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://cdn.modrinth.com https://docs.modrinth.com https://*.forgecdn.net https://minotar.net; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#0a0c0d" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <title>Orvian Launcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
