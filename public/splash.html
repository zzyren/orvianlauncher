<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Orvian Launcher</title>
  <style>
    @font-face {
      font-family: 'Minecraft';
      src: local('Segoe UI'), local('Arial'); /* Fallback for a clean look */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      /* Clean, dark premium background, no cheesy rings or auras */
      background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      position: relative;
    }

    /* Subtle texture overlay to avoid the "flat AI gradient" look */
    .texture-overlay {
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      padding: 0 40px;
    }

    /* Clean logo presentation */
    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
      margin-bottom: 24px;
      transform: translateZ(0);
      animation: gentle-float 6s ease-in-out infinite;
    }

    /* Typography */
    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #f8fafc;
      text-shadow: 0 4px 12px rgba(0,0,0,0.4);
      margin-bottom: 8px;
    }

    .brand-subtitle {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.15em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* Status and Progress */
    .status-container {
      width: 100%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .status-text {
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: opacity 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Beautiful, elegant progress bar */
    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #10b981; /* Emerald */
      border-radius: 4px;
      position: relative;
      transition: width 0.1s linear;
    }

    /* Shimmer effect inside the progress bar */
    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shimmer 1.5s infinite linear;
      transform: translateX(-100%);
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="texture-overlay"></div>

  <div class="container">
    <img src="logo.png" alt="Orvian Logo" class="logo" id="logoImg" onerror="this.style.display='none';" />

    <div class="brand-title">ORVIAN</div>
    <div class="brand-subtitle">Launcher</div>

    <div class="status-container">
      <div class="status-text" id="statusLabel">Cargando chunks...</div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
  </div>

  <script>
    const DURATION = 4800;
    const startTime = Date.now();

    const statusMessages = [
      "Talando árboles...",
      "Fabricando picos de madera...",
      "Minando carbón...",
      "Encontrando diamantes...",
      "Construyendo portal al Nether...",
      "Domando lobos...",
      "Esquivando creepers...",
      "Encantando armadura...",
      "Generando mundo...",
      "¡Todo listo!"
    ];

    const progressBar = document.getElementById('progressBar');
    const statusLabel = document.getElementById('statusLabel');

    let currentMsgIndex = -1;

    function update() {
      const elapsed = Date.now() - startTime;
      const progress = Math.min(1, elapsed / DURATION);
      
      progressBar.style.width = (progress * 100) + '%';

      // Distribute messages evenly across the duration
      const msgIndex = Math.min(
        statusMessages.length - 1, 
        Math.floor(progress * statusMessages.length)
      );

      if (msgIndex !== currentMsgIndex) {
        statusLabel.style.opacity = 0;
        setTimeout(() => {
          statusLabel.textContent = statusMessages[msgIndex];
          statusLabel.style.opacity = 1;
        }, 150);
        currentMsgIndex = msgIndex;
      }

      if (progress < 1) {
        requestAnimationFrame(update);
      }
    }

    requestAnimationFrame(update);
  </script>
</body>
</html>
